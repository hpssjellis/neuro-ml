<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>maxone-sim-v11</title><script src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'></script><script src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'></script><style>body{margin:0;background:#050810;color:#eef;font-family:Arial}#panel{position:absolute;left:10px;top:10px;width:360px;background:rgba(5,9,18,.95);padding:12px;border:1px solid #39445d;border-radius:8px}button,textarea{margin:3px}textarea{width:100%;height:140px}</style></head><body><div id='panel'><h2>MaxOne WetML V11</h2><p>22×46 selected electrodes (1,012), 32 stimulation sites, rectangular 2×4 mm MEA.</p><button onclick='setTopology(2)'>2×2</button><button onclick='setTopology(3)'>3×3</button><button onclick='setTopology(4)'>4×4</button><button onclick='setTopology(5)'>5×5</button><button onclick='toggleMode()' id='modeBtn'>MODE: TRAINING</button><button onclick='toggleRun()'>RUN / STOP</button><button onclick='singleTrial()'>SINGLE TRIAL</button><div id='stats'></div><textarea id='pythonArea'></textarea></div><script>let scene,camera,renderer,controls,arrayGroup,zones=[],electrodes=[],topology=2,running=false,mode='training';init();function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050810);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1000);camera.position.set(0,7,14);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;scene.add(new THREE.AmbientLight(0xffffff,.8));let light=new THREE.PointLight(0xffffff,1.2);light.position.set(0,8,8);scene.add(light);arrayGroup=new THREE.Group();scene.add(arrayGroup);let chip=new THREE.Mesh(new THREE.BoxGeometry(14,.08,7),new THREE.MeshPhongMaterial({color:0x101927}));arrayGroup.add(chip);let group=new THREE.Group();arrayGroup.add(group);for(let r=0;r<22;r++)for(let c=0;c<46;c++){let x=(c/45-.5)*13.5,z=(r/21-.5)*6.6;let m=new THREE.Mesh(new THREE.SphereGeometry(.06,7,7),new THREE.MeshBasicMaterial({color:0x35df72}));m.position.set(x,.04,z);group.add(m);electrodes.push({x,z,mesh:m});}setTopology(2);updatePython();animate();}function setTopology(n){topology=n;zones=[];updateStats();}function toggleMode(){mode=mode==='training'?'inference':'training';document.getElementById('modeBtn').textContent='MODE: '+mode.toUpperCase();}function toggleRun(){running=!running;}function singleTrial(){for(let e of electrodes)e.mesh.material.color.setHex(Math.random()<.025?0x35df72:0x102018);updateStats();}function updateStats(){document.getElementById('stats').innerHTML='Topology: '+topology+'×'+topology+'<br>Electrodes: 1,012<br>Mode: '+mode;}function updatePython(){document.getElementById('pythonArea').value='# MaxOne WetML V11\nfrom maxlab import system, chip\n# Generated protocol template';}function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}</script></body></html>
